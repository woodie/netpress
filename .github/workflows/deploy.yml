# Every push to main is checked, built and deployed, so main is always
# what's live at the homepage.
name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: deploy
    permissions:
      contents: read
      id-token: write # for Workload Identity Federation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: google-github-actions/auth@v2
        with:
          # Woodie's shared GitHub pool (in next-caltrain-feed), and this
          # project's deploy-only account, which trusts only this repo.
          workload_identity_provider: projects/1061341448976/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deploy@outgoing-netpress.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - run: npm run deploy
